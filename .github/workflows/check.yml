name: Check site
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check products.json
        run: node tools/check-products.mjs
      - name: JavaScript syntax
        run: |
          node --check app.js
          cp functions/api/checkout.js /tmp/checkout.mjs && node --check /tmp/checkout.mjs
      - name: Generated pages are up to date
        run: node build.mjs --check
