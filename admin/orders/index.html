<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Orders | VMS Truck Parts</title>
<style>
:root{--bg:#f6f6f4;--card:#fff;--ink:#16181b;--mut:#6b7078;--line:#e3e3df;--acc:#c8102e;--good:#1a7f37;--warn:#b45309;--chip:#f0f0ec}
@media (prefers-color-scheme:dark){:root{--bg:#121315;--card:#1b1d20;--ink:#ececea;--mut:#9aa0a8;--line:#2c2f33;--acc:#ff4d5e;--good:#4ac26b;--warn:#f0a542;--chip:#25282c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
h1{font-size:18px;margin:0 auto 0 0}h2{font-size:16px;margin:0 0 10px}main{max-width:760px;margin:0 auto;padding:16px}
a{color:inherit}button,input,textarea{font:inherit;color:inherit}
button,.btn{background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;text-decoration:none;display:inline-block;font-size:15px}
button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.go{background:var(--good);border-color:var(--good);color:#fff;font-weight:600}
input,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 14px}
.card.sent{opacity:.8}
.top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.top b{font-size:17px}.total{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.mut{color:var(--mut)}.small{font-size:13px}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:13px;font-weight:600;background:var(--chip);margin:4px 4px 0 0}
.pill.todo{background:var(--warn);color:#fff}.pill.done{background:var(--good);color:#fff}.pill.bad{background:var(--acc);color:#fff}
ul{margin:10px 0;padding:0 0 0 18px}li{margin:2px 0}
.addr{background:var(--chip);border-radius:10px;padding:10px 12px;margin:8px 0;white-space:pre-line}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}.tile b{display:block;font-size:24px;line-height:1.1}.tile span{color:var(--mut);font-size:13px}
details summary{cursor:pointer;color:var(--mut);margin-top:6px}
#msg{margin:0 0 12px}.say{margin:8px 0 0;font-weight:600}.empty{color:var(--mut);padding:24px 0;text-align:center}
</style></head>
<body>
<header>
  <h1>Orders</h1>
  <div class="row" id="tabs" style="margin:0"></div>
  <a class="btn" href="/admin/">Stats</a>
</header>
<main>
  <div class="card" id="login" hidden>
    <h2>Enter the stats key</h2>
    <p class="mut">The same key as the stats page. It's saved on this device only. It's the STATS_KEY secret in Cloudflare (Pages project, Settings, Variables and secrets).</p>
    <form id="keyForm" class="row"><input id="key" type="password" autocomplete="off" placeholder="Stats key" style="flex:1;min-width:200px"><button>Open</button></form>
  </div>
  <p id="msg" class="mut"></p>
  <div id="out"></div>
</main>
<script>
(function(){
var $=function(id){return document.getElementById(id)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var get=function(k){try{return localStorage.getItem(k)}catch(e){return null}}, set=function(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
var TZ={timeZone:"Australia/Melbourne"};
var when=function(ts){return new Date(ts).toLocaleString("en-AU",Object.assign({weekday:"short",day:"numeric",month:"short",hour:"numeric",minute:"2-digit"},TZ))};
var money=function(n){return "$"+Number(n||0).toFixed(2)};
var key=get("vms-stats-key")||"", tab=get("vms-orders-tab")||"todo", data=null;

var TABS=[["todo","To send"],["sent","Sent"],["all","All"]];
$("tabs").innerHTML=TABS.map(function(t){return '<button type="button" data-t="'+t[0]+'" aria-pressed="'+(t[0]===tab)+'">'+t[1]+'</button>'}).join("");
$("tabs").onclick=function(e){var b=e.target.closest("button");if(!b)return;tab=b.dataset.t;set("vms-orders-tab",tab);[].forEach.call($("tabs").children,function(x){x.setAttribute("aria-pressed",String(x===b))});render()};
$("keyForm").onsubmit=function(e){e.preventDefault();key=$("key").value.trim();set("vms-stats-key",key);load()};

function isPickup(o){return /pickup/i.test(o.shippingName||"")}
function needsSending(o){return o.paid&&!o.fullyRefunded&&!o.shipped&&!o.ownerTest}
function addrText(o){var a=o.address;return [o.name,a.line1,a.line2,[a.city,a.state,a.postcode].filter(Boolean).join(" ")].filter(Boolean).join("\n")}
function phoneDigits(p){return String(p||"").replace(/[^\d+]/g,"")}

function card(o){
  var pills=[];
  if(o.ownerTest)pills.push('<span class="pill">Your test</span>');
  if(o.fullyRefunded)pills.push('<span class="pill bad">Refunded</span>');
  else if(o.refunded)pills.push('<span class="pill bad">Part refunded '+money(o.refunded)+'</span>');
  if(o.disputed)pills.push('<span class="pill bad">Disputed</span>');
  if(!o.paid)pills.push('<span class="pill bad">Not paid yet</span>');
  if(o.shipped)pills.push('<span class="pill done">'+(isPickup(o)?"Picked up":"Sent")+' '+esc(new Date(o.shipped).toLocaleDateString("en-AU",Object.assign({day:"numeric",month:"short"},TZ)))+'</span>');
  else if(needsSending(o))pills.push('<span class="pill todo">'+(isPickup(o)?"Pickup to arrange":"To send")+'</span>');
  var pc=o.quotedPostcode&&o.address.postcode&&o.quotedPostcode!==o.address.postcode&&!isPickup(o)?'<div class="pill bad">Postage was quoted to '+esc(o.quotedPostcode)+', address is '+esc(o.address.postcode)+'</div>':"";
  var canSend=!!(data.sms||data.email), ph=phoneDigits(o.phone), first=(o.name||"").split(" ")[0];
  var trackMsg="Hi "+first+", your VMS Truck Parts order is on its way."+(o.tracking?" Australia Post tracking: "+o.tracking+" https://auspost.com.au/mypost/track/details/"+o.tracking:"")+" Thanks, AJ";
  var h='<div class="card'+(o.shipped?' sent':'')+'" data-id="'+esc(o.id)+'">'+
    '<div class="top"><div><b>'+esc(o.name||o.email||"Customer")+'</b><div class="mut small">'+esc(when(o.created))+'</div></div><div class="total">'+money(o.total)+'</div></div>'+
    '<div>'+pills.join("")+'</div>'+pc+
    '<ul>'+o.items.map(function(i){return '<li>'+esc(i.qty)+' × '+esc(i.name)+' <span class="mut">'+money(i.total)+'</span></li>'}).join("")+
      '<li class="mut">'+esc(o.shippingName||"Postage")+' '+money(o.shipping)+'</li></ul>'+
    (isPickup(o)?'<div class="addr"><b>Pickup</b> (message them to arrange)</div>':'<div class="addr">'+esc(addrText(o))+'</div>')+
    '<div class="row">'+
      (isPickup(o)?'':'<button type="button" data-act="copy">Copy address</button>')+
      (ph?'<a class="btn" href="tel:'+esc(ph)+'">Call '+esc(o.phone)+'</a><a class="btn" href="sms:'+esc(ph)+'">Text</a>':'')+
      (o.email?'<a class="btn" href="mailto:'+esc(o.email)+'?subject='+encodeURIComponent("Your VMS Truck Parts order")+'">Email</a>':'')+
    '</div>'+
    (o.email?'<div class="mut small">'+esc(o.email)+'</div>':'')+
    (isPickup(o)?'<input data-f="tracking" type="hidden" value="">':'<div class="row"><input data-f="tracking" placeholder="Australia Post tracking number" value="'+esc(o.tracking||"")+'" style="flex:1;min-width:180px"></div>')+
    '<div class="row"><textarea data-f="note" rows="2" placeholder="Private note (optional)">'+esc(o.note||"")+'</textarea></div>'+
    '<div class="row">'+(isPickup(o)||!canSend?'':'<button type="button" class="go" data-act="notify">'+(o.texted||o.emailed?"Send shipped message again":"Send shipped + tracking")+'</button>')+
      (o.shipped
      ?'<button type="button" data-act="save">Save</button><button type="button" data-act="unsend">Mark not sent</button>'
      :'<button type="button"'+(isPickup(o)||!canSend?' class="go"':'')+' data-act="send">'+(isPickup(o)?"Mark picked up":"Mark sent (no message)")+'</button><button type="button" data-act="save">Save note</button>')+
    '</div>'+
    '<p class="say" hidden></p>'+
    '<div class="mut small">'+[
      o.confirmed?"Confirmation emailed ✓":null,
      o.thanked?"Thank-you text sent ✓":null,
      o.texted?"Tracking texted "+esc(when(o.texted))+" ✓":null,
      o.emailed?"Tracking emailed "+esc(when(o.emailed))+" ✓":null
    ].filter(Boolean).join(" · ")+'</div>'+
    (!data.sms&&ph&&!isPickup(o)?'<div class="row"><a class="btn" href="sms:'+esc(ph)+'?&body='+encodeURIComponent(trackMsg)+'">Text tracking from my phone</a></div>':'')+
    '<details><summary>More</summary><div class="row small">'+
      (o.receipt?'<a href="'+esc(o.receipt)+'" target="_blank" rel="noopener">Customer receipt</a>':'')+
      (o.dashboard?'<a href="'+esc(o.dashboard)+'" target="_blank" rel="noopener">Open in Stripe (refunds)</a>':'')+
      '<span class="mut">Items '+money(o.subtotal)+' + postage '+money(o.shipping)+'</span></div></details>'+
  '</div>';
  return h;
}

function render(){
  if(!data)return;
  var all=data.orders, list=all.filter(function(o){return tab==="all"?true:tab==="sent"?!!o.shipped:needsSending(o)});
  var real=all.filter(function(o){return o.paid&&!o.ownerTest});
  var month=new Date().toLocaleString("en-AU",Object.assign({month:"numeric",year:"numeric"},TZ));
  var inMonth=real.filter(function(o){return new Date(o.created).toLocaleString("en-AU",Object.assign({month:"numeric",year:"numeric"},TZ))===month});
  var sum=function(a){return a.reduce(function(s,o){return s+o.total-o.refunded},0)};
  var h='<div class="tiles">'+
    '<div class="tile"><b>'+all.filter(needsSending).length+'</b><span>to send</span></div>'+
    '<div class="tile"><b>'+money(sum(inMonth)).replace(/\.\d\d$/,"")+'</b><span>this month ('+inMonth.length+')</span></div>'+
    '<div class="tile"><b>'+real.length+'</b><span>orders, last year</span></div></div>';
  if(data.marksError)h+='<p class="mut small">'+esc(data.marksError)+'</p>';
  h+=list.length?list.map(card).join(""):'<div class="empty">'+(tab==="todo"?"Nothing to send. All caught up.":"No orders here yet.")+'</div>';
  $("out").innerHTML=h;
}

function say(id,t){$("msg").textContent=t;var c=document.querySelector('.card[data-id="'+id+'"]'),s=c&&c.querySelector(".say");if(s){s.textContent=t;s.hidden=!t;s.scrollIntoView({block:"nearest"})}}
$("out").onclick=function(e){
  var b=e.target.closest("button[data-act]");if(!b)return;
  var c=b.closest(".card"), id=c.dataset.id, o=data.orders.find(function(x){return x.id===id});
  if(b.dataset.act==="copy"){var t=addrText(o)+(o.phone?"\n"+o.phone:"");(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){b.textContent="Copied ✓"},function(){prompt("Copy the address:",t)});return}
  var act=b.dataset.act, shipped=act==="send"||act==="notify"?true:act==="unsend"?false:!!o.shipped;
  var tr=c.querySelector('[data-f=tracking]').value.trim();
  if(act==="notify"){
    if(!tr){say(id,"Type the tracking number first.");c.querySelector('[data-f=tracking]').focus();return}
    if(!data.sms&&!data.email){say(id,"Texting and emailing customers isn't switched on yet, so use Mark sent and the Text button.");return}
    if(!confirm("Send tracking "+tr+" to "+(o.name||"the customer")+(data.sms&&o.phone?" by text":"")+(data.email&&o.email?(data.sms&&o.phone?" and":" by")+" email":"")+"?"))return;
  }
  var body={session:id,shipped:shipped,notify:act==="notify",tracking:c.querySelector('[data-f=tracking]').value,note:c.querySelector('[data-f=note]').value};
  b.disabled=true;b.textContent="Saving…";
  fetch("/api/orders",{method:"POST",headers:{"X-Stats-Key":key,"Content-Type":"application/json"},body:JSON.stringify(body)})
    .then(function(r){return r.json()}).then(function(j){
      if(j.error)throw new Error(j.error);
      o.shipped=j.shipped;o.tracking=j.tracking;o.note=j.note;o.texted=j.texted;o.emailed=j.emailed;
      var notes=[];if(j.sent){["sms","email"].forEach(function(k){var r=j.sent[k];notes.push((k==="sms"?"Text: ":"Email: ")+(r.ok?"sent ✓":r.skipped||r.error))})}
      var t=notes.length?(o.name||"Customer")+". "+notes.join(". "):o.shipped?"Saved. Marked sent ✓ (it's under the Sent tab now).":"Saved.";render();say(id,t);
    }).catch(function(err){b.disabled=false;b.textContent="Try again";say(id,err.message)});
};

function load(){
  if(!key){$("login").hidden=false;$("msg").textContent="";return}
  $("login").hidden=true;$("msg").textContent="Loading orders from Stripe…";
  fetch("/api/orders?days=365",{headers:{"X-Stats-Key":key}}).then(function(r){return r.json().then(function(j){if(r.status===401){set("vms-stats-key",null);key="";throw new Error("Wrong key")}return j})})
    .then(function(j){if(j.error)throw new Error(j.error);data=j;$("msg").textContent="Updated "+when(Date.now())+". Pull down or reopen to refresh.";render()})
    .catch(function(err){$("msg").textContent=err.message;if(!key)$("login").hidden=false});
}
document.addEventListener("visibilitychange",function(){if(!document.hidden&&key)load()});
load();
})();
</script>
</body></html>
