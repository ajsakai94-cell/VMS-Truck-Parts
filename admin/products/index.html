<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Products | VMS Truck Parts</title>
<style>
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:14px 16px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
h1{font-size:18px;margin:0 auto 0 0}h2{font-size:15px;margin:18px 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
main{max-width:900px;margin:0 auto;padding:16px}a{color:inherit}
input{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-height:44px}
button{font:inherit;color:inherit;background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;min-height:40px}
button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 6px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}.tile b{display:block;font-size:24px;line-height:1.1}.tile span{color:var(--mut);font-size:13px}
.list{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.p{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.p:first-child{border-top:0}
.p img{width:56px;height:56px;object-fit:contain;background:#fff;border-radius:8px;border:1px solid var(--line)}
.p .ph{width:56px;height:56px;border-radius:8px;background:var(--chip)}
.p b{display:block}.mut{color:var(--mut)}.small{font-size:13px}
.price{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;margin-top:3px}
.pill.in{background:var(--good);color:#fff}.pill.out{background:var(--warn);color:#fff}
.note{background:var(--chip);border-radius:10px;padding:10px 12px;margin:10px 0 0;font-size:14px}
</style>
<link rel="stylesheet" href="/admin/shell.css?v=1"></head>
<body>
<header>
  <h1>Products and stock</h1>
  <input id="q" type="search" placeholder="Search name, part no. or SKU" aria-label="Search products" style="flex:1 1 220px;max-width:340px">
</header>
<main>
  <div class="tiles" id="tiles"></div>
  <div class="row" id="filters" role="group" aria-label="Show"></div>
  <p class="note">To change a price, mark a part in or out of stock, or add a new part, message Claude in the project. Changes go live after you say "merge".</p>
  <div id="out"><p class="mut">Loading…</p></div>
</main>
<script>
(function(){
var $=function(id){return document.getElementById(id)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var money=function(n){return "$"+Number(n||0).toLocaleString("en-AU",{minimumFractionDigits:2,maximumFractionDigits:2})};
var all=[], show="all";
var F=[["all","All"],["in","In stock"],["out","Sold out"]];
$("filters").innerHTML=F.map(function(f){return '<button type="button" data-f="'+f[0]+'" aria-pressed="'+(f[0]===show)+'">'+f[1]+'</button>'}).join("");
$("filters").onclick=function(e){var b=e.target.closest("button");if(!b)return;show=b.dataset.f;[].forEach.call($("filters").children,function(x){x.setAttribute("aria-pressed",String(x===b))});render()};
$("q").oninput=render;
function hay(p){return [p.name,p.sku,p.mpn,p.cat].concat(p.oem||[],p.cross||[]).join(" ").toLowerCase()}
function render(){
  var q=$("q").value.trim().toLowerCase();
  var list=all.filter(function(p){return (show==="all"||(show==="in")===!!p.available)&&(!q||hay(p).indexOf(q)>=0)});
  var cats=[];list.forEach(function(p){if(cats.indexOf(p.cat)<0)cats.push(p.cat)});
  $("out").innerHTML=list.length?cats.map(function(c){return '<h2>'+esc(c)+'</h2><div class="list">'+list.filter(function(p){return p.cat===c}).map(function(p){
    return '<div class="p">'+(p.thumb?'<img src="'+esc(p.thumb)+'" alt="" loading="lazy">':'<div class="ph"></div>')+
      '<div><b>'+esc(p.name)+'</b><span class="mut small">'+esc(p.sku)+((p.oem||[]).length?' · OE '+esc(p.oem[0]):'')+'</span><br>'+
      '<span class="pill '+(p.available?'in">In stock':'out">Sold out')+'</span> <a class="small mut" href="/parts/'+esc(p.slug)+'/" target="_blank" rel="noopener">View on shop</a></div>'+
      '<div class="price">'+money(p.price)+(p.freightQuote?'<div class="mut small">freight quoted</div>':'')+'</div></div>'}).join("")+'</div>'}).join("")
    :'<p class="mut">No parts match.</p>';
}
fetch("/products.json",{cache:"no-store"}).then(function(r){return r.json()}).then(function(d){
  all=d.products||[];
  var out=all.filter(function(p){return !p.available}).length;
  $("tiles").innerHTML='<div class="tile"><b>'+all.length+'</b><span>parts listed</span></div><div class="tile"><b>'+(all.length-out)+'</b><span>in stock</span></div><div class="tile"><b>'+out+'</b><span>sold out</span></div>';
  render();
}).catch(function(){$("out").innerHTML='<p class="mut">Couldn\'t load the product list. Check your connection and reopen.</p>'});
})();
</script>
<script src="/admin/shell.js?v=1" data-page="products"></script>
</body></html>
